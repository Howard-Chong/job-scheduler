version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: job-scheduler-postgres
    environment:
      POSTGRES_DB: jobscheduler
      POSTGRES_USER: howard
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: job-scheduler-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:


